spring.application.name=aim-tester-api
server.port=8080
server.servlet.context-path=/aim-tester-api

jwt.secret=aim-tester-secret-key-for-jwt-2026-09-25
jwt.expiration=900000

# java.time se serializa como ISO-8601, no como array numérico
spring.jackson.serialization.write-dates-as-timestamps=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Base de datos MySQL (esquema creado con docs/modelo-datos.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/aimtester?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=aimtester
spring.datasource.password=aimtester
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema lo gestiona docs/modelo-datos.sql: la aplicación no lo genera ni lo
# modifica. Tampoco se usa "validate" porque Hibernate no reconoce las columnas
# UNSIGNED de MySQL y abortaría el arranque.
spring.jpa.hibernate.ddl-auto=none

# No se fija hibernate.jdbc.time_zone: se almacena la hora local de la JVM, así
# lo que muestra la interfaz coincide con NOW()/CURDATE() en SQL (la JVM y MySQL
# corren en la misma máquina).
spring.jpa.open-in-view=false

# Crea el usuario admin/admin123 si la tabla users está vacía (solo desarrollo)
aimtester.seed-admin=true

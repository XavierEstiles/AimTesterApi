spring.application.name=aim-tester-api
server.port=8080
server.servlet.context-path=/aim-tester-api

jwt.secret=aim-tester-secret-key-for-jwt-2026-09-25
jwt.expiration=900000

spring.jackson.serialization.write-dates-as-timestamps=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Los tests usan H2 en memoria con esquema generado desde las entidades,
# para que no dependan de una base de datos MySQL disponible.
spring.datasource.url=jdbc:h2:mem:aimtester;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE,KEY
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=false

aimtester.seed-admin=true
